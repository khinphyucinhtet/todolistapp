<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Best Reminder App | Completed Tasks</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="completed">
    <main class="app-frame">
      <section class="screen">
        <header class="app-header">
          <a class="header-link" href="home.html" aria-label="Back">←</a>
          <span class="header-title">Completed Tasks</span>
          <span class="header-link" aria-hidden="true">✓</span>
        </header>

        <div class="screen-content">
          <div class="completed-actions">
            <button type="button" data-completed-select-all>Select All</button>
            <button class="hidden" type="button" data-completed-clear-selected>Clear Selection</button>
            <button type="button" data-completed-delete-selected>Delete Selected</button>
            <button type="button" data-completed-delete-all>Delete All</button>
          </div>
          <section class="completed-list" data-completed-list aria-live="polite"></section>
        </div>

        <nav class="bottom-nav" aria-label="Bottom navigation">
          <a class="nav-item" data-nav="home" href="home.html">
            <span class="nav-icon" aria-hidden="true">⌂</span>
            <span>Home</span>
          </a>
          <a class="nav-item" data-nav="lists" href="view_list.html">
            <span class="nav-icon" aria-hidden="true">☷</span>
            <span>Lists</span>
          </a>
          <a class="nav-item" data-nav="calendar" href="calendar.html">
            <span class="nav-icon" aria-hidden="true">🗓</span>
            <span>Calendar</span>
          </a>
          <a class="nav-item" data-nav="profile" href="profile.html">
            <span class="nav-icon" aria-hidden="true">👤</span>
            <span>Profile</span>
          </a>
        </nav>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
