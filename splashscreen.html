<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Best Reminder App | Splash</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="splash-body" data-page="splash">
    <main class="app-frame splash-frame">
      <section class="screen splash-screen" data-splash-screen data-splash-target="home.html" data-splash-delay="3000">
        <div class="splash-stack">
          <div class="logo-burst" aria-hidden="true">
            <span class="spark spark-1"></span>
            <span class="spark spark-2"></span>
            <span class="spark spark-3"></span>
            <span class="spark spark-4"></span>
            <span class="spark spark-5"></span>
            <span class="spark spark-6"></span>
            <div class="clip-logo">
              <div class="clipboard">
                <span class="face-eye"></span>
                <span class="face-smile"></span>
                <span class="face-blush"></span>
              </div>
              <span class="logo-pencil"></span>
            </div>
          </div>

          <h1 class="splash-title">Your Best</h1>
          <h1 class="splash-title accent-line">Reminder App</h1>
          <p class="splash-subtitle">Plan it. Do it. Feel accomplished.</p>

          <div class="dot-indicators" aria-hidden="true">
            <span class="active"></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
